/* ---------- Écriture ---------- */
async function write(path,data,merge){
  if(!S.db){toast("Le carnet n'est pas connecté.");return false}
  try{const ref=S.db.doc(path);if(merge){await ref.update(data)}else{await ref.set(data)}return true}
  catch(e){
    if(e&&e.code==='invalid_argument'&&merge){try{await S.db.doc(path).set(data);return true}catch(e2){e=e2}}
    if(e&&e.code==='invalid_argument')toast("Tu n'as pas le droit de modifier ce carnet. Demande un accès Contributeur.");
    else if(e&&e.code==='quota_exceeded')toast('Le carnet est plein : supprime d’anciennes photos.');
    else toast("L'enregistrement a échoué, réessaie dans un instant.");
    return false}}
async function del(path){if(!S.db)return;try{await S.db.doc(path).delete();return true}catch(e){toast('Suppression impossible.');return false}}

/* ---------- Graphiques ---------- */
function lineChart({labels,series,ymin=0,ymax=5,h=210,yStep=1,unit=''}){
  const W=640,L=34,R=14,T=14,B=30,iw=W-L-R,ih=h-T-B;
  const x=i=>L+(labels.length<2?iw/2:i*iw/(labels.length-1));const y=v=>T+ih-(v-ymin)/(ymax-ymin)*ih;
  let g='';for(let v=ymin;v<=ymax+1e-9;v+=yStep){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}${unit}</text>`}
  const step=Math.ceil(labels.length/10);
  const lastI=labels.length-1;labels.forEach((l,i)=>{if((i%step===0&&(lastI-i>=Math.max(1,step/2)||i===lastI))||(i===lastI&&lastI%step>=step/2))g+=`<text x="${x(i)}" y="${h-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`});
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]);let d='',on=false;pts.forEach(p=>{if(!p){on=false;return}d+=(on?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);on=true});
    if(s.area&&pts.filter(Boolean).length>1){const f=pts.filter(Boolean);g+=`<path d="${d}L${f[f.length-1][0]} ${y(ymin)}L${f[0][0]} ${y(ymin)}Z" fill="${s.color}" opacity=".12"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
    const last=pts.map((p,i)=>[p,i]).filter(a=>a[0]).pop();
    pts.forEach((p,i)=>{if(p)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last&&last[1]===i?4.5:3}" fill="${last&&last[1]===i?s.color:'var(--surface)'}" stroke="${s.color}" stroke-width="2"/>`})});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Graphique">${g}</svg></div>`}
const legend=items=>`<div class="legend">${items.map(([c,l,dash])=>`<span><i class="dot" style="background:${c}${dash?';border-radius:2px;width:14px;height:3px':''}"></i>${esc(l)}</span>`).join('')}</div>`;
function domAvg(c,t,d){return avg(AXES.filter(a=>a.d===d).map(a=>getPath(c,'eval.'+t+'.'+a.n)))}
function globAvg(c,t){return avg(AXES.map(a=>getPath(c,'eval.'+t+'.'+a.n)))}
function lastTemps(c){let l=null;TEMPS.forEach(t=>{if(globAvg(c,t)!=null&&(!(c.dates||{})[t]||c.dates[t]<=today()))l=t});return l}
function evalChart(c){return lineChart({labels:TEMPS,series:[...DOMAINES.map(d=>({color:d.color,values:TEMPS.map(t=>domAvg(c,t,d.k))})),{color:'var(--fg)',w:3,dash:true,values:TEMPS.map(t=>globAvg(c,t))}],ymin:1,ymax:5})+legend([...DOMAINES.map(d=>[d.color,d.court]),['var(--fg)','Niveau global',true]])}

function readForm(form,base){const o=clone(base);form.querySelectorAll('[data-f]').forEach(el=>{const f=el.dataset.f;let v;if(el.type==='checkbox')v=el.checked;else if(el.type==='radio'){if(!el.checked)return;v=Number(el.value)}else if(el.dataset.num!==undefined){v=el.value===''?null:Number(el.value)}else v=el.value;setPath(o,f,v)});return o}

   AXES.filter(a=>a.d===d.k).forEach(a=>{const vals=TEMPS.map(t=>getPath(ev,t+'.'+a.n));const f=vals.find(v=>v!=null),l=[...vals].reverse().find(v=>v!=null);const pr=f!=null&&l!=null?l-f:null;

function photoSrc(p){return p.assetId?'/_blob/'+p.assetId:(p.dataUrl||'')}
function initSig(cv){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0E2A5C';let d=false,has=false;
  const p=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const [a,b]=p(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!d)return;const [a,b]=p(e);x.lineTo(a,b);x.stroke();has=true};
  cv.onpointerup=()=>{d=false};cv._has=()=>has;cv._clear=()=>{x.clearRect(0,0,cv.width,cv.height);has=false}}

async function compress(file,max,q){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,s=Math.min(1,max/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));return {blob,dataUrl:cv.toDataURL('image/jpeg',q)}}
async function uploadPhotos(input){const cid=input.dataset.upload,sid=input.dataset.session||null,date=input.dataset.date||today();const files=[...input.files];if(!files.length)return;toast('Envoi des photos…');
  for(const f of files){try{let rec={sessionId:sid,date,caption:'',repere:'',visibleParent:true,createdAt:Date.now()};
    if(S.assets){const {blob}=await compress(f,1600,.8);const r=await S.assets.upload(blob,{type:'image/jpeg'});rec.assetId=r.id}
    else{const {dataUrl}=await compress(f,900,.62);rec.dataUrl=dataUrl}
    await S.db.collection('children/'+cid+'/photos').doc().set(rec)}catch(e){toast('Une photo n’a pas pu être ajoutée.')}}
  toast(files.length>1?'Photos ajoutées':'Photo ajoutée');if(S.view.name==='seance'){S.view.draft=readSessionForm();S.dirty=false;rerenderKeep()}}

function caChart(f){if(!Object.values(f.byMonth).some(v=>v.real||v.prev))return '<p class="small muted" style="padding:18px 0">Le graphique se remplira dès les premières séances planifiées ou réalisées.</p>';const t=today();const months=[-4,-3,-2,-1,0,1,2].map(i=>monthKey(addMonths(t,i)));const vals=months.map(m=>f.byMonth[m]||{real:0,prev:0});const mx=Math.max(1,...vals.map(v=>v.real+v.prev));
  const W=640,H=190,L=46,B=26,T=10,bw=(W-L-10)/months.length;const y=v=>T+(H-T-B)*(1-v/mx);
  let g='';[0,.5,1].forEach(p=>{const v=mx*p;g+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${Math.round(v/100)/10} k€</text>`});
  months.forEach((m,i)=>{const v=vals[i];const x=L+i*bw+bw*.18,w=bw*.64;const cur=m===monthKey(t);

function alertsFor(kids){
  const out=[];const t=today();const prev=monthKey(addMonths(t,-1));
  kids.forEach(c=>{const ss=sessionsOf(c.id);const who=intervName(c);
    const uns=ss.filter(s=>s.date&&s.date<=t&&!s.signature&&s.statut!=='annulee').length;if(uns)out.push({c,who,txt:`${uns} présence${uns>1?'s':''} non signée${uns>1?'s':''}`,cls:'saf',ic:'pen'});
    if(ss.some(s=>monthKey(s.date)===prev&&s.date<=t)&&!(c.rapportsEnvoyes||{})[prev])out.push({c,who,txt:`Rapport de ${monthLbl(prev)} à envoyer`,cls:'cor',ic:'mail'});
    const r=ss.filter(s=>typeof s.regulation==='number'&&s.date<=t).slice(0,3);
    if(r.length===3&&r[0].regulation<r[1].regulation&&r[1].regulation<r[2].regulation)out.push({c,who,txt:'Régulation en baisse sur 3 séances',cls:'lav',ic:'chart'});
    TEMPS.forEach(tp=>{const dt=(c.dates||{})[tp];if(dt&&dt<=t&&globAvg(c,tp)==null&&daysBetween(dt,t)<40)out.push({c,who,txt:`Évaluation ${tp} à saisir`,cls:'azu',ic:'target'})});
  });return out}

function checkUrgent(){if(!S.messages||!$('#modal').hidden||S.dirty)return;const me=actingId();if(!me)return;S._urgSeen=S._urgSeen||new Set();

/* ---------- Historique des séances ---------- */
const FIELD_LBL={date:'Date',heure:'Heure',duree:'Durée',statut:'Statut',activites:'Activités',reactions:'Réactions',comportement:'Comportement',axes:'Axes travaillés',attention:'Minutes d’attention',entree:'Entrée dans la tâche',regulation:'Régulation',reussite:'Réussite du jour',vigilance:'Point de vigilance',pistes:'Pistes',message:'Message aux parents',maison:'Activité maison',compteurs:'Compteurs',signature:'Signature',share:'Partage avec la famille'};
const short=v=>{if(v==null||v==='')return '—';if(Array.isArray(v))return v.join(', ')||'—';if(typeof v==='object')return v.nom!==undefined?'signée par '+(v.nom||'le parent'):Object.entries(v).map(([k,x])=>k+' : '+x).join(', ');const s=String(v);return s.length>70?s.slice(0,70)+'…':s};
function diffSession(a,b){const ch=[];Object.keys(FIELD_LBL).forEach(k=>{const x=JSON.stringify(a[k]??null),y=JSON.stringify(b[k]??null);if(x!==y&&!(a[k]==null&&(b[k]===''||(Array.isArray(b[k])&&!b[k].length)||(typeof b[k]==='object'&&b[k]&&!Object.keys(b[k]).length))))ch.push({f:FIELD_LBL[k],v:k==='signature'?short(b[k]):short(b[k])})});return ch}
function histEntry(action,changes){return {at:Date.now(),by:actingId()||null,byName:actName(),action,changes:(changes||[]).slice(0,12)}}
function withHist(s,entry){return [...(s&&s.historique||[]),entry].slice(-80)}
async function logSession(cid,sid,action,changes,extra={}){const s=(S.sessions[cid]||{})[sid]||{};return write('children/'+cid+'/sessions/'+sid,{...extra,historique:withHist(s,histEntry(action,changes))},true)}
function histView(s){const h=[...(s.historique||[])].reverse();return `<details class="card hist"><summary>Historique des modifications (${h.length})</summary><div style="margin-top:8px">${h.length?h.map(e=>`<div class="e">${memberFace(e.by||'x',28)}<div><div><b>${esc(e.byName||'Quelqu’un')}</b> ${esc(e.action)}</div><div class="tiny muted">${stamp(e.at)}</div>${(e.changes||[]).length?`<ul class="tiny" style="margin:4px 0 0;padding-left:16px">${e.changes.map(c=>`<li><b>${esc(c.f)}</b> : ${esc(c.v)}</li>`).join('')}</ul>`:''}</div></div>`).join(''):'<p class="small muted">Aucune modification enregistrée pour l’instant.</p>'}</div></details>`}

/* ---------- Démarrage complémentaire ---------- */
function bootExtra(db){
  S.events=[];S.messages=[];S.idees=[];
  db.collection('events').orderBy('at','desc').limit(200).onSnapshot(q=>{S.events=q.docs.map(d=>({id:d.id,...d.data()}));renderChrome()},()=>{});
  db.collection('messages').orderBy('at','desc').limit(500).onSnapshot(q=>{S.messages=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view.name==='messages')softRender();else{renderChrome();checkUrgent()}},()=>{});
  db.collection('idees').onSnapshot(q=>{S.idees=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view.name==='aide')softRender()},()=>{});
  try{const th=ls.get('memb-theme','auto');if(th!=='auto')document.documentElement.dataset.theme=th;if(ls.get('memb-size','normal')==='grand')document.documentElement.dataset.size='grand'}catch(e){}
}
function ensureOwner(){if(S._ownerDone||!S.me.isOwner||!S.me.id)return;S._ownerDone=true;if(!S.team[S.me.id])write('team/'+S.me.id,{nom:S.me.name||'Hasan',role:'admin',addedAt:Date.now(),bio:''})}

/* ---------- Modales ---------- */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;const f=m.querySelector('input,textarea,select');if(f)setTimeout(()=>f.focus(),30)}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

const SA=(k,extra='')=>`data-act="stat" data-k="${k}" ${extra} role="button" tabindex="0" title="Voir le détail"`;
function smSess(c,s,right=''){const [lbl,bg,ink]=evStatus(s);return `<div class="li clickable" data-act="open-session" data-c="${c.id}" data-s="${s.id}">${kidFace(c,36)}<div class="body"><div class="small"><b>${esc(c.prenom)}</b> <span class="muted">· ${esc(intervName(c))}</span></div><div class="tiny muted">${jourSem(s.date)} ${fmtLong(s.date)}${s.heure?' · '+s.heure.replace(':','h'):''} · ${hrs(Number(s.duree)||1)} h</div></div>${right||`<span class="chip" style="background:var(--${bg});color:var(--${ink})">${lbl}</span>`}<span class="chev">${I.chev}</span></div>`}
function smSheet(title,sub,body){modal(`<div class="row between" style="flex-wrap:nowrap"><div><h2>${title}</h2>${sub?`<div class="small muted">${sub}</div>`:''}</div><button class="btn link" data-act="close">Fermer</button></div><div class="card" style="padding:4px 14px;max-height:62vh;overflow:auto">${body}</div>`)}
const smEmpty=t=>`<p class="small muted" style="padding:14px 0">${t}</p>`;
function statModal(k,cid){S._stat={k,cid};const t=today(),mk=monthKey(t),nk=monthKey(addMonths(t,1));const kids=cid&&S.children[cid]?[S.children[cid]]:visibleChildren();
  const all=[];kids.forEach(c=>sessionsOf(c.id).forEach(s=>all.push({c,s})));
  const byDate=(a,b)=>(b.s.date+(b.s.heure||'')).localeCompare(a.s.date+(a.s.heure||''));
  if(k==='kids'){return smSheet('Enfants suivis',`${kids.length} dossier${kids.length>1?'s':''}`,kids.map(c=>{const next=sessionsOf(c.id).filter(s=>s.date>=t&&s.statut!=='annulee').pop();const nd=sessionsOf(c.id).filter(s=>s.date<=t&&s.statut!=='annulee').length;
    return `<div class="li clickable" data-act="open-child" data-id="${c.id}">${kidFace(c,40)}<div class="body"><b class="small">${esc(childName(c))}</b><div class="tiny muted">${esc(intervName(c))} · ${nd} séance${nd>1?'s':''} réalisée${nd>1?'s':''}</div><div class="tiny muted">${next?'Prochain : '+jourSem(next.date)+' '+fmtLong(next.date)+(next.heure?' à '+next.heure.replace(':','h'):''):'Aucun rendez-vous à venir'}</div></div><span class="chev">${I.chev}</span></div>`}).join('')||smEmpty('Aucun enfant.'))}
  if(k==='month'){const l=all.filter(x=>monthKey(x.s.date)===mk&&x.s.date<=t&&x.s.statut!=='annulee').sort(byDate);return smSheet(`Séances de ${MOIS[new Date().getMonth()]}`,`${l.length} séance${l.length>1?'s':''} réalisée${l.length>1?'s':''} · ${hrs(l.reduce((a,x)=>a+(Number(x.s.duree)||0),0))} h`,l.map(x=>smSess(x.c,x.s)).join('')||smEmpty('Aucune séance réalisée ce mois-ci.'))}

function recStart(){const C=SR();if(!C){toast('La dictée directe n’est pas disponible ici : utilise le micro du clavier.');return}
  const ta=$('#dicteeG');const r=new C();REC=r;r.lang='fr-FR';r.continuous=true;r.interimResults=true;REC_T=Date.now();
  r.onresult=e=>{let fin='',inter='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else inter+=x[0].transcript}
    if(fin){ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+fin.trim();S.dirty=true;const d=$('#dictee');if(d)d.value=ta.value;dictTick()}const it=$('#recInterim');if(it)it.textContent=inter};
  r.onerror=e=>{const msg=e.error==='not-allowed'||e.error==='service-not-allowed'?'Le micro n’est pas autorisé dans cette vue. Touche la zone de texte puis le micro 🎙 du clavier : ça marche aussi.':e.error==='no-speech'?'':'La dictée s’est interrompue ('+e.error+').';if(msg){const s=$('#recState');if(s)s.textContent=msg}if(e.error!=='no-speech')recStop()};
  r.onend=()=>{if(REC===r&&!r._stop){try{r.start()}catch(e){recStop()}}};

  REC_TIMER=setInterval(()=>{const s=Math.round((Date.now()-REC_T)/1000);const st=$('#recState');if(st&&!/autoris|interrompue/.test(st.textContent))st.textContent=`Enregistrement… ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · parle naturellement`},500)}

const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function kbHelp(reason){const h=$('#kbHelp');if(!h)return;h.hidden=false;h.innerHTML=`${reason?`<div class="small" style="margin-bottom:6px">${esc(reason)}</div>`:''}<b>Le clavier est ouvert : touche le micro ${I.mic.replace('class="ico"','class="ico" style="width:16px;height:16px;vertical-align:-3px"')} du clavier</b> (en bas, à côté de la barre d’espace), puis parle. Touche « OK » ou le clavier quand tu as fini. La liste se coche toute seule.<div class="tiny muted" style="margin-top:6px">Pas de micro sur le clavier ? Réglages de l’iPhone › Général › Clavier › activer « Dictée ».</div>`}
function kbStart(reason){const ta=$('#dicteeG');if(!ta)return;kbHelp(reason);ta.focus();try{const n=ta.value.length;ta.setSelectionRange(n,n)}catch(e){}if(ta.value&&!/\s$/.test(ta.value)){ta.value+=' '}}
function recStop(){if(REC){REC._stop=true;try{REC.stop()}catch(e){}}REC=null;clearInterval(REC_TIMER);const b=$('#recBtn');if(b){b.classList.remove('on');b.innerHTML=`${I.mic}<span>Parler</span>`}const it=$('#recInterim');if(it)it.textContent=''}

function recStart(){const C=SR();const st=$('#recState');if(st)st.textContent='';
  /* iPhone / iPad ou navigateur sans dictée directe : dictée du clavier (doit se lancer dans le geste du doigt) */
  if(!C||isIOS()){kbStart('');return}
  const ta=$('#dicteeG');let r;try{r=new C()}catch(e){kbStart('La dictée directe n’est pas disponible ici.');return}REC=r;r.lang='fr-FR';r.continuous=true;r.interimResults=true;REC_T=Date.now();let heard=false;
  r.onstart=()=>{heard=true};r.onaudiostart=()=>{heard=true};
  r.onresult=e=>{heard=true;let fin='',inter='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else inter+=x[0].transcript}
    if(fin){ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+fin.trim();S.dirty=true;const d=$('#dictee');if(d)d.value=ta.value;dictTick();rsSaveSoon()}const it=$('#recInterim');if(it)it.textContent=inter};
  r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;recFail(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'?'Le micro n’est pas autorisé pour l’application sur cet appareil.':'La dictée directe s’est interrompue.')};
  r.onend=()=>{if(REC===r&&!r._stop){try{r.start()}catch(e){recFail('La dictée directe s’est arrêtée.')}}};
  try{r.start()}catch(e){recFail('Impossible de démarrer le micro.');return}
  setTimeout(()=>{if(REC===r&&!heard)recFail('Le micro ne répond pas.')},4000);
  const b=$('#recBtn');b.classList.add('on');b.innerHTML=`<span class="dot-rec"></span><span>Arrêter</span>`;
  REC_TIMER=setInterval(()=>{const s=Math.round((Date.now()-REC_T)/1000);const x=$('#recState');if(x)x.textContent=`Enregistrement… ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · parle naturellement`},500)}
const _dictModal0=dictModal;
dictModal=function(){_dictModal0();const g=$('#dicteeG');if(!g)return;

  $('#recState').insertAdjacentHTML('afterend',`<div class="banner men" id="kbHelp" hidden></div><button type="button" class="btn ghost sm" id="kbBtn" data-act="kb-dict" hidden style="align-self:center">${I.mic}Utiliser le micro du clavier</button>`)};

function chStats(ch,now){now=now||Date.now();const ev=[...(ch&&ch.ev||[])].sort((a,b)=>a.t-b.t);const end=ch&&ch.end||now;
  let state='wait',label=null,since=ch.start,prev=null,wait=0,pauseTot=0,run=0,best=0,workAt=null,lastAct=null;const acts={},order=[],ints=[],byCause={};let nInt=0;

  for(const e of ev){if(e.t>end||e.k==='start'||e.k==='note'||e.k==='photo'||e.k==='end')continue;
    if(e.k==='act'){flush(e.t);if(workAt==null)workAt=e.t;if(e.label!==label||state!=='work')run=0;state='work';label=e.label;lastAct=e.label;if(!order.includes(e.label))order.push(e.label)}

    else if(e.k==='back'){flush(e.t);state=lastAct?'work':'wait';label=lastAct}
    else if(e.k==='pause'){flush(e.t);prev={state,label};state='pause';label=e.reason||''}
    else if(e.k==='resume'){flush(e.t);if(prev){state=prev.state;label=prev.label}prev=null}}

  return {total,wait,workAt,work,intTot,nInt,byCause,acts,order,ints,best,pauseTot,state,label,curSince,ended:!!ch.end,avgBack:nInt?intTot/nInt:0,engage:total-(workAt?wait:total)>0?work/(total-wait):0}}

const chDur=ms=>{const s=Math.round(ms/1000);if(s<60)return s+' s';const m=Math.floor(s/60);if(m<60)return m+' min'+(s%60&&m<10?' '+String(s%60).padStart(2,'0'):'');return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};

/* ================= v12b : minuteur fiable ================= */
/* 1. L'état du minuteur est gardé en mémoire : une version plus ancienne venue du serveur ne l'écrase jamais */
const CH_MEM={};
const _chGet1=chGet;
chGet=function(cid,sid){const o=_chGet1(cid,sid);if(Object.prototype.hasOwnProperty.call(CH_MEM,sid)){const m=CH_MEM[sid];if(m===null)return o&&(o.rev||0)>(CH_MEM['_del_'+sid]||0)?o:null;if(!o||(m.rev||0)>=(o.rev||0))return m}if(o)CH_MEM[sid]=o;return o};
const _chSave1=chSave;
chSave=function(cid,sid,ch){CH_MEM[sid]=ch;_chSave1(cid,sid,ch)};
/* 2. Envoi au carnet une écriture à la fois, avec message clair en cas d'échec */
const CH_BUSY={};let CH_ERRT=0;
function chErr(e){const code=(e&&e.code)||'';const now=Date.now();if(now-CH_ERRT<8000)return;CH_ERRT=now;
  toast(code==='invalid_argument'?'Le minuteur n’a pas pu écrire dans le carnet (droits ou séance supprimée). Tout reste gardé sur l’écran.':code==='resource_exhausted'?'Le carnet est très sollicité : le minuteur réessaie dans quelques secondes. Rien n’est perdu.':'Enregistrement du minuteur en attente ('+(code||'réseau')+'). Rien n’est perdu, il réessaie.')}
chPush=async function(cid,sid){const k=cid+'/'+sid;if(!S.db||CH_BUSY[k])return;CH_BUSY[k]=true;
  try{let n=0;while(CH_PENDING[k]&&n<5){n++;const ch=CH_PENDING[k];try{await S.db.doc('children/'+cid+'/sessions/'+sid).update({chrono:JSON.parse(JSON.stringify(ch))});if(CH_PENDING[k]===ch)delete CH_PENDING[k]}catch(e){chErr(e);break}}}
  finally{CH_BUSY[k]=false;chSyncPaint()}};
/* 3. Toute erreur est affichée au lieu d'échouer en silence */
let ERR_T=0;function showErr(m){const now=Date.now();if(now-ERR_T<5000)return;ERR_T=now;try{toast('Erreur : '+String(m||'').slice(0,140))}catch(e){}}
window.addEventListener('error',e=>showErr(e.message));window.addEventListener('unhandledrejection',e=>showErr(e.reason&&(e.reason.message||e.reason.code)||e.reason));
/* 4. Choisir une activité lance toujours le minuteur */
function chStartAct(label){const {cid,sid}=chCur();let ch=chGet(cid,sid);const now=Date.now();
  if(!ch||!ch.start){ch={start:now,ev:[{t:now,k:'start'}],by:actingId()||null,byName:actName()};chSetActive({cid,sid})}
  if(ch.end){delete ch.end;ch.ev=(ch.ev||[]).filter(e=>e.k!=='end')}
  ch.ev=[...(ch.ev||[]),{t:now,k:'act',label}];chSave(cid,sid,ch);try{localStorage.setItem('memb-chrono-seen',String(now))}catch(x){}
  render();window.scrollTo(0,0);toast('Activité commencée : '+label)}
Object.assign(ACT,{
 'ch-act':el=>{const l=el.dataset.l;closeModal();try{chStartAct(l)}catch(e){showErr(e.message)}},
 'ch-act-in':async()=>{const v=(($('#chActIn')||{}).value||'').trim();if(!v)return;const save=($('#chActSave')||{}).checked;closeModal();try{chStartAct(v)}catch(e){showErr(e.message)}if(save&&!actByName(v))await actWrite('',{t:v,d:'Autre',m:'',x:'',by:actingId()||null,byName:actName(),at:Date.now()})},
 'ch-start':()=>{const {cid,sid}=chCur();const now=Date.now();const ch={start:now,ev:[{t:now,k:'start'}],by:actingId()||null,byName:actName()};chSave(cid,sid,ch);chSetActive({cid,sid});try{localStorage.setItem('memb-chrono-seen',String(now));navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}render();window.scrollTo(0,0)},
});

/* ================= v13 : sauvegarde complète (toutes les photos, y compris profils et activités) ================= */
backup=async function(){
  const btn=$('#bkBtn'),msg=$('#bkMsg');const withPh=$('#bkPhotos')?$('#bkPhotos').checked:true;
  btn.disabled=true;msg.textContent='Lecture du carnet…';
  try{const docs={};const blobs={};
    for(const c of BK_COLS)(await listCol(c)).forEach(([p,d])=>docs[p]=d);
    const kids=await listCol('children');kids.forEach(([p,d])=>docs[p]=d);
    let n=0;for(const [p] of kids){n++;msg.textContent=`Lecture des dossiers… ${n}/${kids.length}`;
      (await listCol(p+'/sessions')).forEach(([q,d])=>docs[q]=d);
      (await listCol(p+'/photos')).forEach(([q,d])=>docs[q]=d)}
    if(withPh){const ids=new Set();const scan=v=>{if(!v||typeof v!=='object')return;for(const [k,x] of Object.entries(v)){if(['assetId','photoId','img'].includes(k)&&typeof x==='string'&&/^[0-9a-f]{32}$/.test(x))ids.add(x);else if(typeof x==='object')scan(x)}};
      Object.values(docs).forEach(scan);let i=0;
      for(const id of ids){i++;msg.textContent=`Lecture des photos… ${i}/${ids.size}`;try{const r=await fetch('/_blob/'+id);if(r.ok)blobs[id]=await blobToDataUrl(await r.blob())}catch(e){}}}
    const count=Object.keys(docs).length;
    const file={app:'carnet-memb',format:2,createdAt:new Date().toISOString(),counts:{elements:count,enfants:kids.length,photos:Object.keys(blobs).length},docs,blobs};
    const name='carnet-memb-sauvegarde-'+today()+'.json';
    msg.textContent='Préparation du fichier…';
    if(!S.downloads){msg.textContent='Le téléchargement n’est pas disponible dans cette vue.';return}
    await S.downloads.save({filename:name,data:new Blob([JSON.stringify(file)],{type:'application/json'})});
    msg.textContent=`Sauvegarde téléchargée : ${count} éléments${Object.keys(blobs).length?', '+Object.keys(blobs).length+' photos':''}.`;
    if(S.role==='admin'){try{await S.db.doc('settings/main').update({lastBackup:{at:Date.now(),docs:count,by:S.me.id||null}})}catch(e){}}
    toast('Sauvegarde téléchargée')}
  catch(e){msg.textContent=e&&e.code==='declined'?'Téléchargement annulé.':'La sauvegarde a échoué. Réessaie dans un instant.'}
  finally{btn.disabled=false}};

function navBtns(dest,origin,lbl){if(!dest)return '';return `<span class="navbtns"><a class="btn ghost sm" href="${gmapsUrl(dest,origin)}" target="_blank" rel="noopener">${I.map}${lbl||'Google Maps'}</a><a class="btn ghost sm" href="${wazeUrl(dest)}" target="_blank" rel="noopener">${I.map}Waze</a></span>`}
/* étapes de la journée d'une personne : domicile → rdv → rdv → domicile */
function dayStops(uid,d){const out=[];Object.values(S.children).forEach(c=>sessionsOf(c.id).forEach(s=>{if(s.date===d&&s.statut!=='annulee'&&travelerOf(c,s)===uid)out.push({c,s})}));return out.sort((a,b)=>(a.s.heure||'99').localeCompare(b.s.heure||'99'))}
function originFor(uid,c,s){const st=dayStops(uid,s.date);const i=st.findIndex(x=>x.s.id===s.id);const prev=i>0?st[i-1]:null;if(prev&&addrOf(prev.c))return {addr:addrOf(prev.c),lbl:'Depuis le rdv de '+prev.c.prenom};const h=homeOf(uid);return h?{addr:h,lbl:'Depuis le domicile'}:null}

/* ======================= 2. KILOMÈTRES ======================= */
const RT={};const RT_PEND=new Set();let RT_BUSY=false;
const rtKey=(a,b)=>a.toLowerCase()+'|'+b.toLowerCase();
function rtGet(a,b){if(!a||!b)return null;if(a.toLowerCase()===b.toLowerCase())return {km:0,src:'identique'};return RT[rtKey(a,b)]||RT[rtKey(b,a)]||null}
function rtNeed(a,b){if(!a||!b||rtGet(a,b))return;RT_PEND.add(JSON.stringify([a,b]))}
async function rtFlush(){if(RT_BUSY||!RT_PEND.size)return;RT_BUSY=true;try{while(RT_PEND.size){const batch=[...RT_PEND].slice(0,12);batch.forEach(x=>RT_PEND.delete(x));const pairs=batch.map(x=>JSON.parse(x));
  const r=await fetch('/api/route',{method:'POST',headers:{'Content-Type':'application/json','X-MEMB':'1'},credentials:'same-origin',body:JSON.stringify({pairs})});if(!r.ok)break;const j=await r.json();

function legsOf(uid,d){const home=homeOf(uid);const st=dayStops(uid,d);if(!st.length)return {stops:st,legs:[]};const pts=[];if(home)pts.push({addr:home,lbl:'Domicile'});st.forEach(x=>pts.push({addr:addrOf(x.c),lbl:x.c.prenom+(x.s.heure?' · '+fmtH(x.s.heure):''),c:x.c,s:x.s}));if(home)pts.push({addr:home,lbl:'Domicile'});

    if(mgr&&s.date>=t&&s.date<=addDays(t,14)&&indispoOf(travelerOf(c,s),s.date)&&!replOf(c,s))add('remplacer',{c,s})}));

function contratHtml(k){const c=k.contenu||{};const cl=c.client||{};const e=c.enfant||{};const ib=(k.client||{}).iban||'';const sa=(k.signatureAsso&&k.signatureAsso.img)?k.signatureAsso:(k.statut!=='signe'&&S.settings&&S.settings.signatureAsso)||k.signatureAsso||{};const sc=k.signatureClient;
  const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;const tarif=c.tarif?Number(c.tarif):55;const eu=x=>String(x.toFixed(2)).replace('.',',');
  return `<div class="ct" id="contrat">
  <div class="head">MON ENFANT, MA BATAILLE</div><div class="meta">Association loi 1901 – Accompagnement éducatif à domicile<br>${ORG.adresse} | N° RNA ${ORG.rna} | N° SIREN 103769725</div>
  <h2>CONTRAT DE PRESTATION ÉDUCATIVE À DOMICILE</h2><div class="sub">Soutien scolaire – Accompagnement éducatif – Développement cognitif<br>Services à la Personne – Mode Prestataire – Déclaration simple</div>
  <div class="sub" style="margin-top:6px">Référence : ${v(k.numero)}</div>
  <h3>ARTICLE PRÉAMBULE – PRÉSENTATION DE L'ASSOCIATION</h3>
  <div class="box"><b>À propos de Mon enfant, Ma bataille</b><br>Mon enfant, Ma bataille est une association loi 1901 fondée par des parents engagés, convaincus qu'un accompagnement éducatif personnalisé, bienveillant et ambitieux peut transformer le parcours de CHAQUE ENFANT — qu'il soit en difficulté scolaire, porteur de troubles neurodéveloppementaux (TSA, TDAH, DYS, TDC, retard de développement…) ou simplement en quête de stimulation et d'épanouissement.<br>Siège social : ${ORG.adresse}<br>N° SAP : ${ORG.sap} | RNA : ${ORG.rna} | Mode d'intervention : PRESTATAIRE<br>Déclaration enregistrée par la DRIEETS Hauts-de-Seine – Récépissé ${ORG.recepisse}</div>
  <div class="box"><b>Nos Prestations</b><br>– Soutien scolaire adapté<br>– Accompagnement éducatif au langage et à la communication<br>– Motricité fine à visée éducative<br>– Activités d'éveil éducatif et sensoriel<br>– Liaison pédagogique avec l'équipe pluridisciplinaire</div>
  <h3>ARTICLE 1 – IDENTIFICATION DES PARTIES</h3>
  <h4>1.1 Le Prestataire</h4><table>${row('Dénomination',ORG.nom)}${row('Forme juridique',ORG.forme)}${row('SIRET',ORG.siret)}${row('N° SAP',ORG.sap)}${row('RNA',ORG.rna)}${row('Adresse',ORG.adresse)}${row('Téléphone',ORG.tel)}${row('Email',ORG.email)}${row('Présidente',ORG.presidente)}</table>
  <h4>1.2 Le Client (représentant légal de l'enfant)</h4><table>${row('Nom et prénom',v([cl.prenom,cl.nom].filter(Boolean).join(' ')))}${row('Adresse',v(cl.adresse))}${row('Téléphone',v(cl.telephone))}${row('Email',v(cl.email))}${row('Date et lieu de naissance',v(cl.naissanceDate?fmtD(cl.naissanceDate)+(cl.naissanceLieu?' à '+cl.naissanceLieu:''):''))}${row('IBAN (pour l’avance immédiate URSSAF)',v(ib))}${row('Lien avec l\'enfant',v(cl.lien))}${row('Autorité parentale',v(cl.autorite))}</table>
  <h4>1.3 L'Enfant bénéficiaire</h4><table>${row('Nom et prénom',v([e.prenom,e.nom].filter(Boolean).join(' ')))}${row('Date de naissance',v(fmtD(e.naissance)))}${row('Classe / niveau scolaire',v(e.classe))}${row('Diagnostic (si applicable)','<span style="color:#666">Non recueilli dans l’application (cadre éducatif). À transmettre, si vous le souhaitez, directement à la coordination.</span>')}</table>
  <h3>ARTICLE 2 – OBJET ET CADRE DE L'INTERVENTION</h3>
  <p>Le présent contrat définit les conditions dans lesquelles l'Association Mon enfant, Ma bataille (ci-après « le Prestataire ») s'engage à fournir des prestations éducatives à domicile au bénéfice de l'enfant désigné à l'article 1.3, dans le cadre du régime des Services à la Personne (SAP) – Déclaration simple.</p>
  <div class="box warn"><b>⚠ CLAUSE DE CADRAGE ÉDUCATIF OBLIGATOIRE</b><br>L'intervenant assure un accompagnement éducatif à domicile. Il n'assure pas la garde de l'enfant, ni l'assistance aux actes de la vie quotidienne (habillage, repas, hygiène). Un parent ou responsable légal reste présent ou joignable à tout moment pendant toute intervention.<br>Le Prestataire n'intervient pas en qualité de service de soins, de rééducation ou de thérapie. Les prestations relèvent exclusivement du soutien scolaire et de l'accompagnement éducatif, conformément aux activités déclarées au titre du récépissé n°2026-234.</div>
  <h4>2.1 Description des prestations</h4><p>Ligne 1 – Accompagnement éducatif enfants en retard de développement : accompagnement éducatif personnalisé à domicile incluant soutien scolaire, activités d'éveil éducatif, accompagnement éducatif au langage et à la communication, activités éducatives de motricité fine et de coordination.</p>
  <h3>ARTICLE 3 – ORGANISATION ET PLANNING DES INTERVENTIONS</h3>
  <h4>3.1 Volume et horaires</h4><table>${row('Volume hebdomadaire',v(c.volume?String(c.volume).replace('.',',')+' heures / semaine':''))}${row('Jours d\'intervention',v(c.jours))}${row('Horaires',v(c.horaires))}${row('Lieu d\'intervention',c.lieuSeances?v(c.lieuSeances):'Domicile du Client – adresse article 1.2')}${row('Durée minimale par séance','1 heure (aucune séance inférieure à 1h ne sera facturée)')}</table>
  <h4>3.2 Intervenant(s)</h4><p>Le Prestataire désignera un ou plusieurs intervenants qualifiés. Le Client sera informé du nom et des qualifications de l'intervenant principal avant la première séance. Le Prestataire agit en qualité d'unique employeur des intervenants. Le Client n'entretient aucune relation contractuelle directe avec eux.</p><p>En cas d'absence imprévue de l'intervenant habituel, le Prestataire s'engage à en informer le Client dans les meilleurs délais et à proposer un remplacement ou un report de séance.</p>
  <h4>3.3 Projet Pédagogique Personnalisé (P3)</h4><p>Un Projet Pédagogique Personnalisé (P3) est co-construit avec la famille dans les 15 jours suivant la signature du présent contrat. Il définit les objectifs éducatifs à 3 et 6 mois, les méthodes retenues, et les indicateurs de progression. Ce document est remis aux deux parties sous forme de document distinct. Il est réévalué à mi-parcours (3 mois) et à l'échéance du contrat.</p>
  <h3>ARTICLE 4 – CONDITIONS FINANCIÈRES</h3>
  <h4>4.1 Tarif</h4><table>${row('Tarif horaire TTC',v(c.tarif?eu(tarif)+' € / heure':''))}${row('Mode de paiement',v(c.paiement||'Virement / CESU préfinancé / Prélèvement'))}${row('Rythme de facturation','Mensuel, en fin de mois')}${row('Délai de règlement','15 jours à compter de la date d\'émission')}</table>
  <h4>4.2 Crédit d'impôt</h4><div class="box">✓ Crédit d'impôt de 50 % sur les dépenses engagées (art. 199 sexdecies CGI).<br>Une attestation fiscale annuelle est adressée avant le 31 mars de chaque année suivante.<br>Exemple : pour ${eu(tarif)} €/h facturés, le coût net famille après crédit d'impôt est de ${eu(tarif/2)} €/h.</div>
  <h4>4.3 Pénalités de retard</h4><p>Tout règlement au-delà de 30 jours calendaires entraîne l'application d'intérêts de retard au taux légal en vigueur. Passé 45 jours sans règlement et après mise en demeure, le Prestataire se réserve le droit de suspendre les interventions.</p>
  <h3>ARTICLE 5 – DURÉE, RENOUVELLEMENT ET RÉSILIATION</h3>
  <h4>5.1 Durée initiale</h4><table>${row('Durée du contrat','6 (six) mois fermes')}${row('Date de début',v(fmtD(c.debut)))}${row('Date d\'échéance initiale',v(fmtD(c.fin)))}</table>
  <h4>5.2 Renouvellement par tacite reconduction</h4><p>À l'issue de la période initiale de 6 mois, le présent contrat se renouvelle automatiquement pour des périodes successives de 6 mois par tacite reconduction, sauf dénonciation par l'une des parties dans les conditions prévues à l'article 5.3.</p><div class="box"><b>Procédure de non-renouvellement :</b> pour ne pas reconduire le contrat à son échéance, chaque partie doit notifier sa décision par courrier (avec accusé de réception) au moins 1 (un) mois avant la date d'échéance. Passé ce délai, le renouvellement est réputé acquis pour 6 mois supplémentaires.</div>
  <h4>5.3 Résiliation en cours de contrat (après la 1ère période)</h4><p>Après la première période de 6 mois, chaque partie peut résilier le contrat avec un préavis d'un (1) mois, notifié par email ou lettre recommandée avec accusé de réception. La résiliation prend effet à l'expiration du préavis. Les séances réalisées pendant le préavis sont dues et facturées.</p><p>Pendant la période initiale de 6 mois, le contrat ne peut être résilié que dans les cas prévus à l'article 6 (résiliation pour motif légitime).</p>
  <h4>5.4 Période d'essai</h4><p>Les 30 premiers jours constituent une période d'observation réciproque. Durant cette période, chaque partie peut mettre fin au contrat avec un préavis de 7 jours, sans justification obligatoire, par simple notification par email.</p>
  <h3>ARTICLE 6 – RÉSILIATION POUR MOTIF LÉGITIME – DROITS DU PRESTATAIRE</h3>
  <p>Le Prestataire se réserve le droit de mettre fin au présent contrat de manière anticipée, avec un préavis de 15 jours (sauf cas d'urgence justifiant une résiliation immédiate), dans les situations suivantes :</p>
  <h4>6.1 Annulations répétées sans motif légitime</h4><p>Constitue un motif légitime de résiliation le fait pour le Client d'annuler ou de reporter des séances de manière répétée sans justification valable. Seuil de déclenchement :<br>– 3 annulations ou reports de dernière minute (moins de 48h avant la séance) sur une période de 2 mois glissants, hors cas de force majeure<br>– ou 5 annulations au total sur la durée d'un contrat de 6 mois</p><p>Les cas de force majeure reconnus incluent : hospitalisation de l'enfant ou d'un parent, urgence médicale documentée, décès dans la famille immédiate, sinistre grave au domicile. Toute autre raison ne constitue pas un cas de force majeure.</p><p>En cas de dépassement du seuil, le Prestataire adressera un avertissement écrit. En l'absence d'amélioration dans les 30 jours suivants, la résiliation pourra être prononcée.</p>
  <h4>6.2 Comportements violents ou dangereux de l'enfant</h4><p>Le Prestataire peut résilier le contrat avec effet immédiat si l'enfant adopte des comportements physiquement violents ou dangereux envers l'intervenant (coups, morsures, projections d'objets, automutilation grave en présence de l'intervenant sans possibilité d'intervention sécurisée…).</p><p>Dans ce cas, le Prestataire notifie la résiliation par écrit avec description factuelle des incidents. Les séances antérieures restent dues. Aucune pénalité n'est appliquée au Client, les comportements violents d'un enfant étant distincts de sa responsabilité personnelle.</p>
  <h4>6.3 Incompatibilité relationnelle</h4><p>En application du principe de confiance réciproque inhérent aux prestations éducatives à domicile, le Prestataire peut mettre fin au contrat en cas d'incompatibilité relationnelle persistante (définie comme une mésentente manifeste et durable entre l'intervenant et l'enfant et/ou sa famille, rendant impossible la poursuite des interventions dans des conditions professionnelles satisfaisantes).</p><p>Ce motif peut être invoqué dès lors que le Coordinateur pédagogique de l'Association l'a constaté et documenté, après au moins deux tentatives de médiation ou d'ajustement.</p>
  <h4>6.4 Absence de progression pédagogique</h4><p>L'équipe pédagogique de l'Association peut décider de mettre fin au contrat si, après 3 mois d'intervention, elle constate objectivement qu'aucun progrès mesurable n'est observé malgré la mise en œuvre rigoureuse du Projet Pédagogique Personnalisé, et si les facteurs d'échec sont extérieurs à l'intervention elle-même (manque d'implication familiale, environnement incompatible, besoins dépassant le cadre éducatif et relevant d'une prise en charge thérapeutique spécialisée exclusive).</p><p>Ce motif sera formalisé dans un compte rendu pédagogique remis au Client, accompagné de recommandations d'orientation vers des professionnels plus adaptés.</p>
  <h4>6.5 Comportement irrespectueux envers les intervenants</h4><p>Tout comportement irrespectueux, injurieux ou harcelant du Client ou d'un membre de sa famille à l'égard des intervenants du Prestataire constitue un motif de résiliation immédiate, sans préavis et sans indemnité.</p>
  <h4>6.6 Non-paiement</h4><p>Le défaut de paiement de deux factures consécutives, après mise en demeure restée sans réponse sous 8 jours ouvrés, autorise le Prestataire à suspendre immédiatement les interventions et à résilier le contrat sans préavis. Les sommes dues restent exigibles.</p>
  <h4>6.7 Situation dépassant le cadre éducatif</h4><p>Si l'état de l'enfant nécessite une prise en charge médicale, thérapeutique ou institutionnelle exclusive que le Prestataire n'est pas habilité à fournir, celui-ci peut mettre fin au contrat avec un préavis de 15 jours, accompagné d'un courrier d'orientation adressé aux parents.</p>
  <h3>ARTICLE 7 – ABSENCES ET ANNULATIONS DU CLIENT</h3>
  <h4>7.1 Délai de prévenance</h4><p>Toute annulation doit être signalée au Prestataire au minimum 48 heures avant la séance planifiée.</p>
  <h4>7.2 Facturation en cas d'annulation tardive</h4><table>${row('Annulation ≥ 48h avant','Séance non facturée – report possible')}${row('Annulation entre 24h et 48h','50 % du tarif horaire facturé')}${row('Annulation < 24h ou absence','100 % du tarif horaire facturé')}${row('Force majeure documentée','Séance non facturée, report prioritaire')}</table>
  <h4>7.3 Vacances et suspension temporaire</h4><p>Des périodes de suspension (vacances scolaires, événement familial) peuvent être convenues d'un commun accord et notifiées au minimum 15 jours à l'avance par email. La suspension ne prolonge pas automatiquement la durée du contrat.</p>
  <h3>ARTICLE 8 – OBLIGATIONS DES PARTIES</h3>
  <h4>8.1 Obligations du Prestataire</h4><p>– Fournir des intervenants formés aux pédagogies adaptées (Montessori, ABA, soutien scolaire différencié)<br>– Respecter et mettre en œuvre le Projet Pédagogique Personnalisé co-construit<br>– Maintenir une communication régulière avec les parents (comptes rendus, bilans)<br>– Respecter la confidentialité absolue sur l'enfant et la famille<br>– Remettre une attestation fiscale annuelle avant le 31 mars<br>– Disposer en permanence d'une assurance RC Professionnelle valide<br>– Ne jamais se substituer aux professionnels de santé (orthophoniste, psychomotricien, médecin)</p>
  <h4>8.2 Obligations du Client</h4><p>– Assurer la présence ou la joignabilité d'un parent ou responsable légal lors de chaque intervention<br>– Fournir un espace calme, sécurisé et adapté à l'intervention éducative<br>– Communiquer tout changement médical, comportemental ou scolaire significatif<br>– Respecter les plannings convenus ou prévenir dans les délais (art. 7)<br>– Régler les factures dans les délais convenus<br>– Ne pas solliciter directement les intervenants de l'Association à titre personnel ou professionnel<br>– Soutenir activement le projet éducatif à domicile (prolongement dans la vie familiale)</p>
  <h3>ARTICLE 9 – CONFIDENTIALITÉ ET PROTECTION DES DONNÉES</h3>
  <p>Toutes les informations relatives à l'enfant (situation scolaire, diagnostic éventuel, comportements, rapports pédagogiques) sont strictement confidentielles. Le Prestataire s'engage à ne les communiquer à aucun tiers sans accord écrit préalable du Client, sauf obligation légale.</p><p>Conformément au Règlement Général sur la Protection des Données (RGPD – Règlement UE 2016/679), le Client dispose d'un droit d'accès, de rectification, de portabilité et de suppression de ses données personnelles. Pour exercer ces droits : ${ORG.email}</p>
  <h4>9.1 Vos avis et témoignages</h4><p>Votre regard sur l’accompagnement de votre enfant compte beaucoup pour nous. Lorsque vous nous confiez un avis positif ou un témoignage, vous nous autorisez, avec toute notre reconnaissance, à le partager pour faire connaître l’association à d’autres familles (site internet, réseaux sociaux, documents de présentation).</p><p>Nous le reprenons fidèlement, uniquement avec votre prénom ou vos initiales, sans jamais citer le nom de votre enfant ni aucune information le concernant. Vous pouvez à tout moment nous demander de ne pas le partager ou de le retirer, par simple message : nous le ferons sans délai, et cela ne change rien à l’accompagnement.</p><p>Partage de mes avis : ${v(c.avis)}</p>
  <h3>ARTICLE 10 – RESPONSABILITÉ ET ASSURANCE</h3>
  <p>Le Prestataire est couvert par une assurance responsabilité civile professionnelle pour les dommages causés dans le cadre de ses interventions. Sa responsabilité ne saurait être engagée en cas de force majeure, d'informations erronées communiquées par le Client, ou de faits extérieurs à son contrôle.</p><p>Les prestations constituent une obligation de moyens et non de résultat. Les progrès de l'enfant dépendent de nombreux facteurs (régularité, implication familiale, stade développemental) et ne peuvent être garantis contractuellement.</p><p>Le Client s'engage à informer le Prestataire de tout risque particulier relatif à la sécurité de l'intervenant au domicile (animal dangereux, matériaux, comportements à risque connus de l'enfant).</p>
  <h3>ARTICLE 11 – DISPOSITIONS DIVERSES</h3>
  <h4>11.1 Non-sollicitation des intervenants</h4><p>Le Client s'engage à ne pas recruter, embaucher ou solliciter directement les intervenants du Prestataire pendant la durée du contrat et dans les 12 mois suivant sa résiliation, sous peine d'une indemnité forfaitaire équivalente à 6 mois de prestations au tarif contractuel.</p>
  <h4>11.2 Dérogation au remboursement lors des vacances scolaires</h4><p>Les séances non réalisées pendant les vacances scolaires officielles, dûment notifiées 15 jours à l'avance, ne sont pas facturées. Le volume annuel contractuel est calculé sur 44 semaines scolaires.</p>
  <h4>11.3 Modification du contrat</h4><p>Toute modification substantielle (tarif, volume horaire, prestations) nécessite un avenant écrit signé des deux parties. Les ajustements de planning ponctuel peuvent être convenus par email.</p>
  <h4>11.4 Loi applicable – Litiges</h4><p>Le présent contrat est soumis au droit français. En cas de différend, les parties s'engagent à rechercher une solution amiable. À défaut d'accord dans les 30 jours, le litige sera soumis au tribunal judiciaire compétent du ressort de Nanterre.</p>
  <h4>11.5 Références réglementaires</h4><p>– Code du travail : art. L7231-1, L7231-2, D7231-1, D7233-1 à D7233-4<br>– Code général des impôts : art. 199 sexdecies (crédit d'impôt SAP)<br>– Récépissé SAP n°2026-234, délivré par la DRIEETS Hauts-de-Seine le 06 mai 2026<br>– RGPD – Règlement UE 2016/679<br>– Arrêté du 22 décembre 2015 relatif aux prix des prestations SAP</p>
  <h3>ARTICLE 12 – SIGNATURES</h3>
  <p>Fait en deux exemplaires originaux, dont un remis à chaque partie (signature électronique, copie par email).</p>
  <p>À ${v(sc&&sc.lieu?sc.lieu:c.lieuSignature)}, le ${sc?v(fmt(dIso(sc.at))):v('','date de la signature')}</p>
  <div class="ksig"><div><b>Pour le Prestataire</b><br>Mon enfant, Ma bataille<br>${esc(sa.nom||ORG.presidente)} – ${esc(sa.qualite||'Présidente')}<br>Signature :${sa.img?`<img src="${sa.img}" alt="Signature de l’association">`:'<br><span class="empty">à apposer</span>'}</div>

function sigPadInit(cv){if(!cv)return;const ctx=cv.getContext('2d');const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1A2B5C';
  let draw=false,last=null;cv._n=0;const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{draw=true;S.dirty=true;last=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()};
  cv.onpointermove=e=>{if(!draw)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;cv._n++;e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=()=>{draw=false}}
function sigPadData(cv){if(!cv||(cv._n||0)<12)return null;const w=cv.width,h=cv.height;const out=document.createElement('canvas');const sc=Math.min(1,600/w);out.width=Math.round(w*sc);out.height=Math.round(h*sc);const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(cv,0,0,out.width,out.height);return out.toDataURL('image/png')}

      const child={prenom:e.prenom||'Enfant',nom:e.nom||'',naissance:e.naissance||'',classe:e.classe||'',etablissement:e.ecole||'',adresse:adr,parentRef:[p.prenom,p.nom].filter(Boolean).join(' '),telephone:p.telephone||'',email:p.email||'',intervenante:o.intervenante||'',createdAt:Date.now(),objectifs:[{},{},{}],inscription:d.id};if(Number(o.tarif))child.tarif=Number(o.tarif);

     try{const us=(await api15('/api/admin/users')).users;const u=us.find(x=>x.id===d.id);if(u&&!u.children.includes(cid)){const r=await fetch('/api/admin/users/'+encodeURIComponent(d.id),{method:'PATCH',headers:{'Content-Type':'application/json','X-MEMB':'1'},credentials:'same-origin',body:JSON.stringify({children:[...u.children,cid]})});if(!r.ok)throw new Error('lien')}}catch(x){toast('Le compte du parent n’a pas pu être rattaché : fais-le dans le panneau d’administration.')}
     const k=contratFromDossier(d,{...o,cid});if(!k.client.iban)delete k.client.iban;const ref=S.db.collection('contrats').doc();
     if(await write('contrats/'+ref.id,k)){await write('dossiers/'+d.id,{statut:'valide',cid,valideLe:Date.now(),validePar:actName()},true);FAM_AT=0;toast('Contrat '+k.numero+' envoyé à la famille pour signature');go('enfant',{id:cid,tab:'contrats'})}else el.disabled=false}catch(x){toast('Erreur : '+x.message);el.disabled=false}},
 'k-upload':el=>{const cid=el.dataset.c;const i=document.createElement('input');i.type='file';i.accept='application/pdf,image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>25e6){toast('Fichier trop lourd (25 Mo maximum).');return}toast('Envoi du document…');
   try{const r=await fetch('/api/contrats/upload?cid='+encodeURIComponent(cid),{method:'POST',headers:{'Content-Type':f.type||'application/pdf','X-MEMB':'1'},credentials:'same-origin',body:f});const j=await r.json();if(!r.ok)throw new Error(j.message||'erreur');
     await famLoad(true);const fam=(FAM||[]).find(x=>x.cid===cid);const ref=S.db.collection('contrats').doc();const d={cid,parentUid:fam&&fam.parents[0]?fam.parents[0].id:null,type:'televerse',statut:'signe',nom:f.name.replace(/\.[a-z0-9]+$/i,'')||'Contrat signé',fichier:{id:j.id,url:j.url,mime:j.mime,taille:j.size},creeLe:Date.now(),signeLe:Date.now(),creePar:meId(),creeParNom:actName()};
     if(await write('contrats/'+ref.id,d)){toast('Contrat signé ajouté : la famille peut le consulter');render()}}catch(x){toast('Envoi impossible : '+x.message)}};i.click()},
 'k-cancel':async el=>{if(!confirm('Annuler ce contrat ?'))return;if(await write('contrats/'+el.dataset.k,{statut:'annule',annuleLe:Date.now(),annulePar:actName()},true)){toast('Contrat annulé');render()}},
 'k-new':async el=>{const cid=el.dataset.c;await famLoad(true);const fam=(FAM||[]).find(x=>x.cid===cid);const ps=fam?fam.parents:[];

function tContrats(c){famLoad();const ks=S.contrats.filter(k=>k.cid===c.id).sort((a,b)=>(b.creeLe||0)-(a.creeLe||0));
  return `<div class="card row between" style="gap:10px"><span class="small">Contrats de ${esc(c.prenom)} : préparés dans l’application et signés au doigt, ou contrats papier signés à téléverser.</span><div class="row" style="gap:6px"><button class="btn sm" data-act="k-new" data-c="${c.id}">${I.plus}Préparer un contrat</button><button class="btn ghost sm" data-act="k-upload" data-c="${c.id}">${I.upload}Téléverser un contrat signé</button></div></div>
  <div class="card" style="padding:4px 16px">${ks.length?ks.map(k=>`<div class="li"><div class="body small"><b>${k.type==='televerse'?esc(k.nom||'Contrat signé'):'Contrat '+esc(k.numero||'')}</b><div class="tiny muted">${k.type==='televerse'?'Téléversé':'Préparé'} le ${fmt(dIso(k.creeLe))}${k.signatureClient?' · signé par '+esc(k.signatureClient.nom)+' le '+fmt(dIso(k.signatureClient.at)):''}</div></div>${kPill(k)}<button class="btn ghost sm" data-act="nav-contrat" data-k="${k.id}">Voir</button>${k.statut==='a_signer'?`<button class="btn link sm" data-act="k-cancel" data-k="${k.id}">Annuler</button>`:''}</div>`).join(''):`<div style="padding:8px 0">${emptyBox('Aucun contrat','','file','lav')}</div>`}</div>`}
function vContrat(){const k=S.contrats.find(x=>x.id===S.view.kid);if(!k)return `<div class="card">${emptyBox('Contrat introuvable','')}</div>`;const c=S.children[k.cid];
  return `<div class="stack"><button class="btn ghost sm" style="align-self:flex-start" data-act="back-child-k" data-c="${k.cid||''}">${I.back}${c?esc(c.prenom):'Retour'}</button>${contratView(k,false)}</div>`}
ACT['back-child-k']=el=>el.dataset.c?go('enfant',{id:el.dataset.c,tab:'contrats'}):go('atraiter');
/* signature de l'association (une fois pour toutes) */
function saImportFile(file){if(!file)return;if(file.size>5e6){toast('Image trop lourde (5 Mo max).');return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,600/Math.max(im.width,im.height));const w=Math.round(im.width*sc),h=Math.round(im.height*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),p=d.data;let x0=w,y0=h,x1=-1,y1=-1;for(let i=0;i<p.length;i+=4){const l=(p[i]+p[i+1]+p[i+2])/3;const a=Math.max(0,Math.min(255,Math.round((235-l)*255/110)))*p[i+3]/255;p[i+3]=a>8?a:0;if(p[i+3]){const q=i/4,px=q%w,py=(q-px)/w;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}}if(x1<0){toast('Aucune signature détectée sur l’image.');return}x.putImageData(d,0,0);const m=6;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w-1,x1+m);y1=Math.min(h-1,y1+m);const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);S.saImport=o.toDataURL('image/png');const pv=$('#saPrev'),cv=$('#sigA');if(pv){pv.src=S.saImport;pv.style.display='block'}if(cv)cv.style.display='none';S.dirty=true};im.src=rd.result};rd.readAsDataURL(file)}
ACT['sa-save']=async()=>{const img=S.saImport||sigPadData($('#sigA'));if(!img){toast('Signe dans le cadre blanc ou importe une image.');return}S.saImport=null;const val={img,nom:($('#saN').value||'').trim()||ORG.presidente,qualite:($('#saQ').value||'').trim()||'Présidente',at:Date.now()};if(await write('settings/main',{signatureAsso:val},true)){S.settings.signatureAsso=val;closeModal();toast('Signature de l’association enregistrée');render()}};
ACT['sa-edit']=()=>{modal(`<h2>Signature de l’association</h2><p class="small muted">Elle sera apposée sur chaque contrat préparé dans l’application.</p><canvas class="sigpad" id="sigA"></canvas><img id="saPrev" alt="" style="display:none;height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px"><div class="row" style="margin:6px 0;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="sa-clear">Effacer</button><label class="btn ghost sm" style="cursor:pointer">Importer une image (PNG/JPG)<input type="file" id="saFile" accept="image/png,image/jpeg" style="display:none"></label></div><div class="fields two"><label class="f"><span>Nom</span><input type="text" id="saN" value="${esc((S.settings.signatureAsso||{}).nom||ORG.presidente)}"></label><label class="f"><span>Qualité</span><input type="text" id="saQ" value="${esc((S.settings.signatureAsso||{}).qualite||'Présidente')}"></label></div><div class="row" style="margin-top:10px"><button class="btn" data-act="sa-save">Enregistrer</button><button class="btn ghost" data-act="close">Annuler</button></div>`);S.saImport=null;setTimeout(()=>{sigPadInit($('#sigA'));const f=$('#saFile');if(f)f.onchange=()=>saImportFile(f.files[0])},50)};

(async function boot(){
  renderChrome();
  const [db,user]=await Promise.all([use('db'),use('user')]);
  S.db=db;S.user=user;if(db)bootExtra(db);
  if(!db){$('#main').innerHTML=`<div class="card empty" style="margin-top:40px"><b>Connecte-toi pour ouvrir le carnet</b>Le carnet de suivi s'ouvre dans Claude, avec ton compte de l'équipe MEMB.</div>`;return}
  if(user){try{const m=await user.me();S.me={id:m.id,isOwner:m.isOwner,name:m.name}}catch(e){}}
  use('assets').then(a=>S.assets=a);use('sample').then(s=>S.sample=s);use('downloads').then(d=>S.downloads=d);
  db.collection('team').onSnapshot(q=>{S.team={};q.docs.forEach(d=>S.team[d.id]={id:d.id,...d.data()});computeRole();ensureOwner();resolveProfiles(Object.keys(S.team));softRender()},()=>{});
  db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?d.data():{};softRender()},()=>{});
  db.collection('tasks').onSnapshot(q=>{S.tasks={};q.docs.forEach(d=>S.tasks[d.id]={id:d.id,...d.data()});softRender()},()=>{});
  db.collection('billing').onSnapshot(q=>{S.billing={};q.docs.forEach(d=>S.billing[d.id]=d.data());softRender()},()=>{});
  db.collection('children').onSnapshot(q=>{S.children={};q.docs.forEach(d=>S.children[d.id]={id:d.id,...d.data()});S.loaded.children=true;Object.keys(S.children).forEach(subSessions);resolveProfiles(Object.values(S.children).map(c=>c.intervenante));softRender()},

})();
